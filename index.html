<!doctype html>
<!--
  index.html — the single page of the app.
  Everything visible is created here or filled in by src/main.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full phone screen, including notches -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1720" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>PeakFinder</title>
  </head>
  <body>
    <header class="topbar">
      <h1>PeakFinder <span class="tag">prototype</span></h1>
      <span id="version" class="version"></span>
    </header>

    <!-- Where you are and what the calculation used -->
    <div id="location" class="location">—</div>

    <!-- The panorama is drawn on this canvas -->
    <main class="stage">
      <canvas id="panorama" aria-label="Mountain skyline panorama"></canvas>

      <!-- Loading box, shown while tiles download and the skyline is calculated -->
      <div id="loading" class="loading" hidden>
        <p id="loading-text">Loading…</p>
        <div class="progress"><div id="loading-bar"></div></div>
      </div>
    </main>

    <!-- Controls: turn left/right, zoom, and how far to look -->
    <nav class="controls" aria-label="View controls">
      <button id="turn-left" aria-label="Turn left">◀</button>
      <span id="heading" class="heading">—</span>
      <button id="turn-right" aria-label="Turn right">▶</button>

      <label>View
        <select id="fov">
          <option value="30">30°</option>
          <option value="60" selected>60°</option>
          <option value="120">120°</option>
          <option value="360">360°</option>
        </select>
      </label>

      <label>Range
        <select id="distance"></select>
      </label>

      <button id="test-location" class="wide">Paradise test</button>
    </nav>

    <!-- Quick checks: whether this phone/browser supports what the app needs -->
    <details class="checks">
      <summary>Device checks</summary>
      <ul id="checks"></ul>
    </details>

    <!-- Data attribution — must always stay visible (filled by src/ui/attribution.ts) -->
    <footer id="attribution" class="attribution"></footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
